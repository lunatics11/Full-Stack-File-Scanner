<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>ScaNex</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style0.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body class="bg-ful">
    <video autoplay muted loop id="bg-video">
        <source src="{{ url_for('static', filename='videos/background.mp4') }}" type="video/mp4">
    </video>

    <nav class="navbar navbar-expand-lg bg-nav mb-4">
        <div class="container-fluid">
            <a class="navbar-brand text-white" href="/">
                <span class="neon-logo">ScaNeX</span>
            </a>
        </div>
    </nav>

    <div class="container">
        <!-- ... flash messages ... -->
        {% block content %}{% endblock %}
    </div>

    {% if request.path == '/' %}
    <!-- Right Side Slider Panel - ONLY SHOWS ON INDEX PAGE -->
    <div class="info-panel">
        <div class="info-content">
            <h2>File Scanner API</h2>
            <p>Advanced security analysis for your files</p>

            <div class="info-section">
                <h3><i class="fas fa-shield-alt"></i> Features</h3>
                <ul>
                    <li>Malware detection</li>
                    <li>VirusTotal integration</li>
                    <li>YARA rule scanning</li>
                </ul>
            </div>
        </div>
    </div>
    {% endif %}

    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"></script>
</body>
</html>
